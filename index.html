<style>
  :root{
    --mono:'JetBrains Mono', ui-monospace, monospace;
    --sans:-apple-system, 'Inter', 'Segoe UI', sans-serif;
    --accent-text:#ffffff;
  }

  /* ================= COLOUR THEMES (10) ================= */
  :root, [data-theme="green"]{ --accent:#2f8f6f; --accent-rgb:47,143,111; --accent-dark:#215f4c; }
  [data-theme="blue"]{ --accent:#2f6fbf; --accent-rgb:47,111,191; --accent-dark:#204f87; }
  [data-theme="purple"]{ --accent:#7c5cbf; --accent-rgb:124,92,191; --accent-dark:#5a4189; }
  [data-theme="pink"]{ --accent:#c85a8f; --accent-rgb:200,90,143; --accent-dark:#96406a; }
  [data-theme="orange"]{ --accent:#d97a3f; --accent-rgb:217,122,63; --accent-dark:#a85a28; }
  [data-theme="red"]{ --accent:#c0453d; --accent-rgb:192,69,61; --accent-dark:#8f332c; }
  [data-theme="gold"]{ --accent:#c9a02e; --accent-rgb:201,160,46; --accent-dark:#96791f; }
  [data-theme="teal"]{ --accent:#2f9fa8; --accent-rgb:47,159,168; --accent-dark:#1f7178; }
  [data-theme="indigo"]{ --accent:#4c5fd9; --accent-rgb:76,95,217; --accent-dark:#38449e; }
  [data-theme="brown"]{ --accent:#8a6142; --accent-rgb:138,97,66; --accent-dark:#644630; }

  /* ================= LIGHT / DARK MODE ================= */
  :root, [data-mode="light"]{
    --bg:#e8edf1; --panel:#e8edf1; --panel-alt:#e8edf1;
    --ink:#1a2b27; --muted:#5f7570;
    --line: rgba(20,30,28,0.08);
    --neu-light:#ffffff; --neu-dark:#b7c1c8;
    --warn:#c98a2e; --warn-soft: rgba(201,138,46,0.14);
    --danger:#c0453d; --danger-soft: rgba(192,69,61,0.12);
    --ok:var(--accent); --ok-soft: rgba(var(--accent-rgb),0.14);
    --accent-soft: rgba(var(--accent-rgb),0.14);
  }
  [data-mode="dark"]{
    --bg:#20242a; --panel:#20242a; --panel-alt:#20242a;
    --ink:#e9edf0; --muted:#98a3ab;
    --line: rgba(255,255,255,0.08);
    --neu-light:#2b3038; --neu-dark:#121519;
    --warn:#e0a94a; --warn-soft: rgba(224,169,74,0.18);
    --danger:#e0645a; --danger-soft: rgba(224,100,90,0.18);
    --ok:var(--accent); --ok-soft: rgba(var(--accent-rgb),0.22);
    --accent-soft: rgba(var(--accent-rgb),0.22);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans); min-height:100vh;
    transition:background-color 0.25s ease, color 0.25s ease;
  }
  button, input, select{ font-family:var(--sans); }

  /* ---------- Neumorphic helpers ---------- */
  .neu-raised{ box-shadow:6px 6px 14px var(--neu-dark), -6px -6px 14px var(--neu-light); }
  .neu-raised-sm{ box-shadow:3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light); }
  .neu-pressed{ box-shadow:inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light); }

  header{
    background:var(--bg); border-bottom:none; padding:16px 20px;
    display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:20;
    box-shadow:0 6px 16px -10px var(--neu-dark), 0 1px 0 var(--line);
    transition:background-color 0.25s ease, box-shadow 0.25s ease;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-mark{ width:34px; height:34px; border-radius:12px; background:var(--accent); display:flex; align-items:center; justify-content:center; color:#fff; font-size:17px; flex-shrink:0; box-shadow:3px 3px 8px var(--neu-dark), -3px -3px 8px var(--neu-light); }
  .brand-name{ font-weight:800; font-size:1.05rem; }
  .brand-tag{ font-size:0.68rem; color:var(--muted); font-family:var(--mono); }

  .header-actions{ display:flex; align-items:center; gap:10px; position:relative; }
  .sync-badge{ width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .sync-badge.local{ background:#9ca3af; }
  .sync-badge.syncing{ background:var(--accent); animation:pulse-sync 1s infinite; }
  .sync-badge.synced{ background:var(--ok); }
  .sync-badge.error{ background:var(--danger); }
  @keyframes pulse-sync{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }
  .icon-btn{
    width:36px; height:36px; border-radius:11px; border:none; background:var(--bg); color:var(--muted); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    box-shadow:4px 4px 9px var(--neu-dark), -4px -4px 9px var(--neu-light);
    transition:box-shadow 0.15s ease, color 0.15s ease;
  }
  .icon-btn:hover{ color:var(--ink); }
  .icon-btn:active, .icon-btn.is-open{ box-shadow:inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light); color:var(--accent); }

  /* ---------- Theme / dark mode panel ---------- */
  .theme-panel{
    position:absolute; top:48px; right:0; background:var(--bg); border-radius:16px; padding:16px;
    width:224px; box-shadow:8px 8px 22px var(--neu-dark), -8px -8px 22px var(--neu-light);
    z-index:40; display:none;
  }
  .theme-panel.open{ display:block; }
  .theme-panel-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .theme-panel-label{ font-size:0.78rem; font-weight:800; color:var(--ink); }
  .mode-toggle{
    width:52px; height:28px; border-radius:20px; border:none; background:var(--bg); cursor:pointer;
    box-shadow:inset 3px 3px 6px var(--neu-dark), inset -3px -3px 6px var(--neu-light);
    position:relative; padding:0;
  }
  .mode-toggle .knob{
    position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--accent);
    display:flex; align-items:center; justify-content:center; font-size:0.68rem; color:#fff;
    box-shadow:2px 2px 5px var(--neu-dark); transition:left 0.2s ease, background 0.2s ease;
  }
  .mode-toggle.is-dark .knob{ left:27px; }
  .theme-swatch-title{ font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; color:var(--muted); font-weight:700; margin-bottom:10px; }
  .theme-swatches{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; }
  .theme-swatch{
    width:30px; height:30px; border-radius:50%; border:none; cursor:pointer; position:relative; padding:0;
    box-shadow:3px 3px 7px var(--neu-dark), -3px -3px 7px var(--neu-light);
  }
  .theme-swatch.active::after{
    content:'\2713'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:0.72rem; font-weight:800; text-shadow:0 1px 2px rgba(0,0,0,0.45);
  }

  .auth-page{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; background:var(--bg); }
  .auth-card{ width:100%; max-width:360px; background:var(--bg); border:none; border-radius:20px; padding:28px 24px; box-shadow:10px 10px 24px var(--neu-dark), -10px -10px 24px var(--neu-light); }
  .auth-title{ font-weight:800; font-size:1.3rem; text-align:center; margin-bottom:4px; }
  .auth-sub{ font-size:0.8rem; color:var(--muted); text-align:center; margin-bottom:22px; }
  .auth-field{ margin-bottom:13px; }
  .auth-field label{ display:block; font-size:0.72rem; color:var(--muted); margin-bottom:5px; text-transform:uppercase; letter-spacing:0.04em; font-weight:700; }
  .auth-field input{ width:100%; padding:10px 12px; border-radius:11px; border:none; font-size:0.9rem; font-family:var(--sans); background:var(--bg); color:var(--ink); box-sizing:border-box; box-shadow:inset 3px 3px 7px var(--neu-dark), inset -3px -3px 7px var(--neu-light); }

<script>
  const $ = id => document.getElementById(id);
  const fmt = n => 'RM' + (Math.round(n * 100) / 100).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  // ==================== TEMA & MOD MALAM ====================
  const THEMES = [
    { id: 'green',  name: 'Hijau',        color: '#2f8f6f' },
    { id: 'blue',   name: 'Biru',         color: '#2f6fbf' },
    { id: 'purple', name: 'Ungu',         color: '#7c5cbf' },
    { id: 'pink',   name: 'Merah Jambu',  color: '#c85a8f' },
    { id: 'orange', name: 'Oren',         color: '#d97a3f' },
    { id: 'red',    name: 'Merah',        color: '#c0453d' },
    { id: 'gold',   name: 'Emas',         color: '#c9a02e' },
    { id: 'teal',   name: 'Teal',         color: '#2f9fa8' },
    { id: 'indigo', name: 'Indigo',       color: '#4c5fd9' },
    { id: 'brown',  name: 'Coklat',       color: '#8a6142' }
  ];

  function initTheme() {
    const savedTheme = localStorage.getItem('holeTheme') || 'green';
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const savedMode = localStorage.getItem('holeMode') || (prefersDark ? 'dark' : 'light');
    applyTheme(savedTheme, false);
    applyMode(savedMode, false);
    renderThemeSwatches();
  }

  function applyTheme(id, save = true) {
    document.documentElement.setAttribute('data-theme', id);
    if (save) localStorage.setItem('holeTheme', id);
    renderThemeSwatches();
  }

  function applyMode(mode, save = true) {
    document.documentElement.setAttribute('data-mode', mode);
    if (save) localStorage.setItem('holeMode', mode);
    const toggle = $('modeToggle');
    if (toggle) toggle.classList.toggle('is-dark', mode === 'dark');
    const knob = $('modeKnob');
    if (knob) knob.textContent = mode === 'dark' ? '\u{1F319}' : '\u2600\uFE0F';
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme) metaTheme.setAttribute('content', mode === 'dark' ? '#20242a' : '#e8edf1');
  }

  function toggleDarkMode() {
    const cur = document.documentElement.getAttribute('data-mode') || 'light';
    applyMode(cur === 'dark' ? 'light' : 'dark');
  }

  function toggleThemePanel() {
    const panel = $('themePanel');
    const btn = $('themeBtn');
    if (!panel) return;
    panel.classList.toggle('open');
    if (btn) btn.classList.toggle('is-open', panel.classList.contains('open'));
  }

  function renderThemeSwatches() {
    const el = $('themeSwatches');
    if (!el) return;
    const active = document.documentElement.getAttribute('data-theme') || 'green';
    el.innerHTML = THEMES.map(t =>
      '<button class="theme-swatch' + (t.id === active ? ' active' : '') + '" style="background:' + t.color + '" title="' + t.name + '" onclick="applyTheme(\'' + t.id + '\')"></button>'
    ).join('');
  }

  document.addEventListener('click', (e) => {
    const panel = $('themePanel');
    const btn = $('themeBtn');
    if (!panel || !panel.classList.contains('open')) return;
    if (panel.contains(e.target) || (btn && btn.contains(e.target))) return;
    panel.classList.remove('open');
    if (btn) btn.classList.remove('is-open');
  });

  let currentTab = 'summary';
  let state = { loans: [], commitments: [], monthlyIncome: 0, deferredIds: [], cashBalance: null, cashBalanceUpdatedAt: null };
  let currentUser = null;
  let syncStatus = 'local'; // 'local' | 'synced' | 'syncing' | 'error'
  let saveDebounceTimer = null;

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function loadStateLocal() {
    try {
      const raw = localStorage.getItem('kawalKomitmenState');
      if (raw) state = Object.assign(state, JSON.parse(raw));
    } catch (e) {}
  }
  function saveStateLocal() {
    try { localStorage.setItem('kawalKomitmenState', JSON.stringify(state)); } catch (e) {}
  }

  async function loadStateCloud() {
    if (!currentUser || !supabaseClient) return false;
    try {
      const { data, error } = await supabaseClient.from('kawal_komitmen_data').select('state_json').eq('user_id', currentUser.id).maybeSingle();
      if (!error && data && data.state_json) {
        state = Object.assign(state, data.state_json);
      }
      return true;
    } catch (e) {
      console.error('Gagal muat data dari cloud', e);
      return false;
    }
  }

  async function saveStateCloud() {
    if (!currentUser || !supabaseClient) return false;
    try {
      await supabaseClient.from('kawal_komitmen_data').upsert({
        user_id: currentUser.id, state_json: state, updated_at: new Date().toISOString()
      }, { onConflict: 'user_id' });
      return true;
    } catch (e) {
      console.error('Gagal simpan data ke cloud', e);
      return false;
    }
  }

  function renderSyncBadge() {
    const el = $('syncBadge');
    if (!el) return;
    el.className = 'sync-badge ' + syncStatus;
    const labels = { local: 'Peranti ini sahaja', syncing: 'Menyegerak\u2026', synced: 'Disegerak ke cloud', error: 'Ralat segerak' };
    el.title = labels[syncStatus] || '';
  }

  // Public entry point used everywhere in the app (unchanged call sites) — always keeps
  // a local copy immediately, and additionally pushes to the cloud (debounced) when logged in.
  function saveState() {
    saveStateLocal();
    if (!currentUser) return;
    clearTimeout(saveDebounceTimer);
    syncStatus = 'syncing';
    renderSyncBadge();
    saveDebounceTimer = setTimeout(async () => {
      const ok = await saveStateCloud();
      syncStatus = ok ? 'synced' : 'error';
      renderSyncBadge();
    }, 500);
  }

  function switchTab(tab) {
    currentTab = tab;
    ['Summary', 'Loans', 'Commits', 'Plan'].forEach(t => {
      $('tab' + t + 'Btn').classList.toggle('active', t.toLowerCase() === tab);
    });
    render();
  }

  // ==================== DATE / STATUS HELPERS ====================
  function daysUntil(dateStr) {
    const due = new Date(dateStr);
    const today = new Date();
    today.setHours(0,0,0,0);
    due.setHours(0,0,0,0);
    return Math.round((due - today) / (1000 * 60 * 60 * 24));
  }

  function monthsOverdue(dateStr) {
    const days = daysUntil(dateStr);
    if (days >= 0) return 0;
    return Math.floor(Math.abs(days) / 30);
  }

  function loanStatus(loan) {
    if (loan.settled) return 'settled';
    const mOver = monthsOverdue(loan.dueDate);
    if (mOver >= 2) return 'overdue2';
    if (mOver >= 1) return 'overdue1';
    return 'active';
  }

  function loanLoss(loan) {
    return Math.max(0, (loan.principal || 0) - (loan.received || 0));
  }

  // AKPK commitments are contractually fixed (part of an official debt management
  // programme) and "penting" commitments are user-declared essentials — both are
  // mandatory and must never be treated as deferrable. Only "tidak-penting" can be
  // suggested for deferral. Centralised here so every check stays consistent.
  function isCommitmentMandatory(c) {
    return c.category === 'akpk' || c.category === 'penting';
  }

  // A commitment counted here as "sudah dibayar guna pinjaman" if some active loan's
  // usedFor points directly at it. That loan's own monthly payment already represents
  // the ongoing cash obligation, so the commitment itself must not also be counted —
  // otherwise the same debt gets deducted twice from today's cash balance.
  function commitmentFundedLoan(commitId) {
    return state.loans.find(l => !l.settled && l.usedFor === ('commit:' + commitId)) || null;
  }
  function isCommitmentFundedByLoan(c) {
    return !!commitmentFundedLoan(c.id);
  }

  // How much CASH is actually left in hand from a loan after it's used to pay a
  // commitment — e.g. pinjam RM1300, guna RM100 bayar Astro, baki RM1200 masih duit
  // sebenar yang ada di tangan. Only applies when usedFor points at a commitment;
  // paying off another loan is just debt-shuffling, not new cash.
  function loanCashInjection(loan) {
    if (!loan.usedFor || loan.usedFor.indexOf('commit:') !== 0) return 0;
    const commitId = loan.usedFor.slice('commit:'.length);
    const commit = state.commitments.find(c => c.id === commitId);
    if (!commit) return 0;
    return Math.max(0, (loan.received || 0) - (commit.amount || 0));
  }

  // Keeps Baki Wang Hari Ini in sync with a loan's current usedFor link: reverses
  // whatever this loan previously injected, then applies the current amount — so
  // editing/removing the link later corrects the cash balance automatically instead
  // of leaving stale amounts behind. Returns the net change applied (+ve/-ve/0).
  function applyCashInjectionForLoan(loan) {
    const prev = loan.cashInjection || 0;
    const next = loanCashInjection(loan);
    const delta = next - prev;
    if (delta !== 0) {
      state.cashBalance = (state.cashBalance || 0) + delta;
      state.cashBalanceUpdatedAt = Date.now();
    }
    loan.cashInjection = next;
    return delta;
  }

  // ==================== RENDER: SUMMARY TAB ====================
  function renderSummaryTab() {
    const activeLoans = state.loans.filter(l => !l.settled);
    const totalOwed = activeLoans.reduce((sum, l) => sum + (l.principal || 0), 0);
    const totalLoss = state.loans.reduce((sum, l) => sum + loanLoss(l), 0);
    const criticalLoans = activeLoans.filter(l => loanStatus(l) === 'overdue2');
    const warnLoans = activeLoans.filter(l => loanStatus(l) === 'overdue1');

    const pentingCommits = state.commitments.filter(c => isCommitmentMandatory(c) && !state.deferredIds.includes(c.id) && !isCommitmentFundedByLoan(c));
    const totalPentingCommits = pentingCommits.reduce((s, c) => s + (c.amount || 0), 0);
    const totalMonthlyObligation = totalPentingCommits + activeLoans.reduce((s, l) => s + (l.monthlyPayment || 0), 0);
    const balance = (state.monthlyIncome || 0) - totalMonthlyObligation;

    // Commitments already settled via a linked loan — shown separately so it's clear why
    // they no longer appear in the cash-based totals above.
    const loanFundedCommits = state.commitments.filter(c => isCommitmentMandatory(c) && !state.deferredIds.includes(c.id) && isCommitmentFundedByLoan(c));
    const totalLoanFundedCommits = loanFundedCommits.reduce((s, c) => s + (c.amount || 0), 0);

    // "Gali lubang tutup lubang" tracking: how much of all loan principal ever taken
    // was used to pay off other debts/commitments, rather than genuine expenses.
    const cycleLoans = state.loans.filter(l => l.usedFor);
    const totalCycleAmount = cycleLoans.reduce((s, l) => s + (l.principal || 0), 0);
    const totalAllLoanPrincipal = state.loans.reduce((s, l) => s + (l.principal || 0), 0);
    const cyclePercent = totalAllLoanPrincipal > 0 ? (totalCycleAmount / totalAllLoanPrincipal) * 100 : 0;

    let html = '';

    // Cash balance card — shown first, since "what do I actually have right now" is the
    // most immediate question when checking in on finances.
    html += '<div class="cash-balance-card" id="cashBalanceCard">';
    if (state.cashBalance === null) {
      html += '<div class="cash-balance-top"><div class="cash-balance-label">Baki Wang Setakat Hari Ini</div></div>';
      html += '<div style="font-size:0.85rem; opacity:0.9; margin-bottom:10px;">Belum direkodkan. Masukkan baki tunai/bank semasa anda untuk lihat status kewangan terkini.</div>';
      html += '<button type="button" class="cash-balance-edit-btn" onclick="toggleCashBalanceEdit()">+ Rekod Baki Sekarang</button>';
    } else {
      html += '<div class="cash-balance-top">';
      html += '<div><div class="cash-balance-label">Baki Wang Setakat Hari Ini</div>';
      html += `<div class="cash-balance-amount">${fmt(state.cashBalance)}</div>`;
      html += `<div class="cash-balance-updated">Dikemas kini ${formatRelativeTime(state.cashBalanceUpdatedAt)}</div></div>`;
      html += '<button type="button" class="cash-balance-edit-btn" onclick="toggleCashBalanceEdit()">Kemas Kini</button>';
      html += '</div>';

      if (totalMonthlyObligation > 0) {
        const cashVsObligation = state.cashBalance - totalMonthlyObligation;
        html += '<div class="cash-balance-vs">';
        if (cashVsObligation < 0) {
          html += `Baki semasa <strong>tidak mencukupi</strong> untuk wajib bayar bulan ini (${fmt(totalMonthlyObligation)}) — berkurangan <strong>${fmt(Math.abs(cashVsObligation))}</strong>.`;
        } else {
          html += `Baki semasa mencukupi untuk wajib bayar bulan ini (${fmt(totalMonthlyObligation)}), berbaki <strong>${fmt(cashVsObligation)}</strong> selepas itu.`;
        }
        html += '</div>';
      }
      if (totalLoanFundedCommits > 0) {
        html += '<div class="cash-balance-vs">';
        html += `🔁 ${loanFundedCommits.length} komitmen (${fmt(totalLoanFundedCommits)}) sudah <strong>dibayar guna duit pinjaman</strong> — bayaran balik untuk pinjaman berkaitan sudah dikira di atas, jadi jumlah ini tidak ditolak lagi daripada baki tunai.`;
        html += '</div>';
      }
    }
    html += '<div class="cash-balance-edit-row" id="cashBalanceEditRow" style="display:none;">';
    html += `<input type="number" id="cashBalanceInput" placeholder="850" value="${state.cashBalance !== null ? state.cashBalance : ''}">`;
    html += '<button type="button" onclick="saveCashBalance()">Simpan</button>';
    html += '</div>';
    html += '</div>';

    // Critical alerts always show first, regardless of tab styling — these need attention now.
    criticalLoans.forEach(l => {
      html += `
        <div class="alert-critical">
          <div class="icon">🚨</div>
          <div>
            <div class="title">${escapeHtml(l.name)} — Tertunggak 2 Bulan (Kritikal)</div>
            <div class="body">Ini tempoh genting. Jika tidak dibayar sebelum masuk bulan ke-3, risiko tindakan lebih serius meningkat. Utamakan pinjaman ini dahulu berbanding komitmen tidak penting.</div>
          </div>
        </div>`;
    });
    warnLoans.forEach(l => {
      html += `
        <div class="alert-warn">
          <div class="icon">⚠️</div>
          <div>
            <div class="title">${escapeHtml(l.name)} — Tertunggak 1 Bulan</div>
            <div class="body">Masih ada masa untuk selesaikan sebelum jadi kritikal. Semak tab Rancang untuk lihat cadangan susunan bayaran.</div>
          </div>
        </div>`;
    });

    html += '<div class="card">';
    html += '<div class="summary-hero">';
    html += `<div class="label">Baki selepas komitmen wajib bulan ini</div>`;
    html += `<div class="amount ${balance < 0 ? 'negative' : 'positive'}">${balance < 0 ? '-' : ''}${fmt(Math.abs(balance))}</div>`;
    if (balance < 0) {
      html += `<div class="summary-note">Nombor ni <strong>bukan untuk buat awak takut</strong> — ia sekadar tunjuk keadaan sebenar supaya awak boleh buat keputusan dengan jelas. Ramai orang pernah lalui fasa ni. Semak tab <strong>Rancang</strong> untuk lihat komitmen mana boleh ditangguh dahulu, supaya baki ni jadi lebih terkawal.</div>`;
    } else {
      html += `<div class="summary-note">Baik — pendapatan awak cukup untuk komitmen wajib bulan ini. Teruskan pantau supaya kekal begini.</div>`;
    }
    html += '</div>';

    html += '<div class="summary-grid">';
    html += `<div class="summary-stat"><div class="n">${fmt(totalOwed)}</div><div class="l">Jumlah pinjaman aktif</div></div>`;
    html += `<div class="summary-stat"><div class="n" style="color:var(--danger);">${fmt(totalLoss)}</div><div class="l">Jumlah kerugian (potongan) sepanjang masa</div></div>`;
    html += `<div class="summary-stat"><div class="n">${criticalLoans.length}</div><div class="l">Pinjaman kritikal (2 bulan+)</div></div>`;
    html += `<div class="summary-stat"><div class="n">${fmt(totalMonthlyObligation)}</div><div class="l">Wajib bayar bulan ini</div></div>`;
    if (totalLoanFundedCommits > 0) {
      html += `<div class="summary-stat"><div class="n">${fmt(totalLoanFundedCommits)}</div><div class="l">Dibayar guna pinjaman</div></div>`;
    }
    html += '</div>';
    html += '</div>';

    if (totalCycleAmount > 0) {
      const severityColor = cyclePercent >= 50 ? 'var(--danger)' : (cyclePercent >= 25 ? 'var(--warn)' : 'var(--accent)');
      html += '<div class="card">';
      html += '<div class="card-title">🔁 Kitaran Bayar Hutang Guna Hutang</div>';
      html += `<div style="text-align:center; padding:6px 0;">`;
      html += `<div style="font-size:1.6rem; font-weight:800; color:${severityColor};">${cyclePercent.toFixed(0)}%</div>`;
      html += `<div style="font-size:0.8rem; color:var(--muted);">daripada jumlah pinjaman (${fmt(totalCycleAmount)} daripada ${fmt(totalAllLoanPrincipal)}) digunakan untuk bayar hutang/komitmen lain</div>`;
      html += '</div>';
      if (cyclePercent >= 50) {
        html += `<div class="summary-note" style="background:var(--danger-soft); color:var(--danger);">Lebih separuh pinjaman awak digunakan untuk bayar hutang lama — ini corak "gali lubang tutup lubang" yang serius. Ini masa yang sesuai untuk hubungi <strong>AKPK (03-2616 7766, percuma)</strong> untuk bincang susunan semula hutang secara rasmi, supaya kitaran ni boleh dipecahkan.</div>`;
      } else if (cyclePercent >= 25) {
        html += `<div class="summary-note" style="background:var(--warn-soft); color:var(--ink);">Sebahagian pinjaman awak digunakan untuk bayar hutang lain. Cuba elak tambah pinjaman baharu untuk tujuan ni jika boleh — semak tab <strong>Rancang</strong> untuk cari jalan lain dahulu.</div>`;
      } else {
        html += `<div class="summary-note">Sebahagian kecil sahaja pinjaman awak dalam kitaran ni — kekal berwaspada supaya tak bertambah.</div>`;
      }
      html += '</div>';
    }

    if (activeLoans.length === 0 && state.commitments.length === 0) {
      html += '<div class="card"><div class="empty-state">Belum ada data. Mula tambah pinjaman atau komitmen di tab lain untuk lihat ringkasan di sini.</div></div>';
    }

    $('contentRoot').innerHTML = html;
  }

  // ==================== RENDER: LOANS TAB ====================
  function renderLoansTab() {
    let html = '<div class="card">';
    html += '<div class="card-title">➕ Tambah Pinjaman Baharu</div>';
    html += '<div class="form-row-2">';
    html += '<div class="form-field"><label>Nama Pinjaman</label><input type="text" id="loanName" placeholder="Contoh: Pinjaman Along, Bank X"></div>';
    html += '<div class="form-field"><label>Tarikh Perlu Bayar Penuh</label><input type="date" id="loanDueDate"></div>';
    html += '</div>';
    html += '<div class="form-row-2">';
    html += '<div class="form-field"><label>Jumlah Pinjaman (Penuh)</label><input type="number" id="loanPrincipal" placeholder="2000" oninput="updateLossPreview()"></div>';
    html += '<div class="form-field"><label>Diterima Di Tangan</label><input type="number" id="loanReceived" placeholder="1300" oninput="updateLossPreview()"></div>';
    html += '</div>';
    html += '<div class="form-field"><label>Bayaran Bulanan (jika ada)</label><input type="number" id="loanMonthlyPayment" placeholder="0 jika bayar sekali gus"></div>';
    html += buildUsedForSelector(null);
    html += '<div class="loss-preview" id="lossPreview">Isi jumlah pinjaman dan jumlah diterima untuk lihat kerugian.</div>';
    html += '<button type="button" class="btn btn-primary" style="margin-top:12px;" onclick="addLoan()">Simpan Pinjaman</button>';
    html += '</div>';

    if (state.loans.length === 0) {
      html += '<div class="card"><div class="empty-state">Belum ada pinjaman direkodkan.</div></div>';
    } else {
      const sorted = state.loans.slice().sort((a, b) => {
        const order = { overdue2: 0, overdue1: 1, active: 2, settled: 3 };
        return order[loanStatus(a)] - order[loanStatus(b)];
      });
      sorted.forEach(l => {
        const status = loanStatus(l);
        const loss = loanLoss(l);
        const days = daysUntil(l.dueDate);
        const badgeLabel = { active: 'Aktif', overdue1: 'Tertunggak 1 Bulan', overdue2: 'KRITIKAL — 2 Bulan+', settled: 'Selesai' }[status];
        html += `<div class="loan-card status-${status}">`;
        html += '<div class="loan-top">';
        html += `<div class="loan-name">${escapeHtml(l.name)}</div>`;
        html += `<span class="loan-badge ${status}">${badgeLabel}</span>`;
        html += '</div>';
        html += '<div class="loan-details">';
        html += `<div class="loan-detail-item"><div class="l">Jumlah Pinjaman</div><div class="v">${fmt(l.principal)}</div></div>`;
        html += `<div class="loan-detail-item"><div class="l">Diterima Tangan</div><div class="v">${fmt(l.received)}</div></div>`;
        html += `<div class="loan-detail-item"><div class="l">Kerugian</div><div class="v ${loss > 0 ? 'loss' : ''}">${fmt(loss)}</div></div>`;
        html += `<div class="loan-detail-item"><div class="l">Bayaran Bulanan</div><div class="v">${l.monthlyPayment ? fmt(l.monthlyPayment) : '—'}</div></div>`;
        html += '</div>';
        const usedForLabel = resolveUsedForLabel(l.usedFor);
        if (usedForLabel) {
          html += `<div class="used-for-tag">🔁 Digunakan untuk bayar: <strong>${escapeHtml(usedForLabel)}</strong>`;
          if (l.cashInjection > 0) {
            html += ` — baki lebihan <strong>${fmt(l.cashInjection)}</strong> sudah masuk Baki Wang Hari Ini`;
          }
          html += '</div>';
        }
        html += '<div class="loan-due-row">';
        if (status === 'settled') {
          html += '<span class="loan-due-text">✓ Telah diselesaikan</span>';
        } else if (days < 0) {
          html += `<span class="loan-due-text urgent">Lewat ${Math.abs(days)} hari (${monthsOverdue(l.dueDate)} bulan)</span>`;
        } else if (days <= 30) {
          html += `<span class="loan-due-text urgent">Wajib bayar dalam ${days} hari</span>`;
        } else {
          html += `<span class="loan-due-text">Due dalam ${days} hari</span>`;
        }
        html += '<div class="loan-actions">';
        html += `<button type="button" class="icon-btn-sm" onclick="toggleEditUsedFor('${l.id}')" title="Tanda guna untuk bayar komitmen/pinjaman lain">🔁</button>`;
        if (status !== 'settled') html += `<button type="button" class="icon-btn-sm" onclick="markLoanSettled('${l.id}')" title="Tanda selesai">✓</button>`;
        html += `<button type="button" class="icon-btn-sm" onclick="removeLoan('${l.id}')" title="Padam">✕</button>`;
        html += '</div>';
        html += '</div>';
        if (editingUsedForLoanId === l.id) {
          html += `<div class="delete-confirm-row" style="background:var(--accent-soft);">
            <span>Duit pinjaman ini digunakan untuk bayar apa? Jika untuk bayar komitmen, <strong>baki lebihan (diterima − jumlah komitmen)</strong> akan ditambah automatik ke Baki Wang Hari Ini, dan komitmen berkenaan akan ditanda "sudah dibayar".</span>
            <div class="form-field" style="margin-bottom:0;">${buildUsedForSelectorInline(l.id, l.usedFor)}</div>
            <div class="delete-confirm-btns">
              <button type="button" class="btn-confirm-cancel" onclick="cancelEditUsedFor()">Batal</button>
              <button type="button" class="btn-confirm-delete" style="background:var(--accent);" onclick="saveUsedFor('${l.id}')">Simpan</button>
            </div>
          </div>`;
        }
        if (pendingDeleteLoanId === l.id) {
          html += `<div class="delete-confirm-row">
            <span>Padam "${escapeHtml(l.name)}"? Tindakan ini tidak boleh dibatalkan.</span>
            <div class="delete-confirm-btns">
              <button type="button" class="btn-confirm-cancel" onclick="cancelRemoveLoan()">Batal</button>
              <button type="button" class="btn-confirm-delete" onclick="confirmRemoveLoan('${l.id}')">Ya, Padam</button>
            </div>
          </div>`;
        }
        html += '</div>';
      });
    }

    $('contentRoot').innerHTML = html;
  }

  // Builds the "used for" dropdown listing every existing loan/commitment as a possible
  // link target, so a new loan can be marked as having been taken specifically to pay
  // off an older debt — the "gali lubang tutup lubang" cycle the user wants tracked.
  function resolveUsedForLabel(usedFor) {
    if (!usedFor) return null;
    const [type, id] = usedFor.split(':');
    if (type === 'loan') {
      const target = state.loans.find(l => l.id === id);
      return target ? target.name : null;
    }
    if (type === 'commit') {
      const target = state.commitments.find(c => c.id === id);
      return target ? target.name : null;
    }
    return null;
  }

  function buildUsedForSelector(excludeLoanId) {
    let html = '<div class="form-field"><label>Duit Ini Digunakan Untuk</label>';
    html += '<select id="loanUsedFor">';
    html += '<option value="">— Perbelanjaan lain (bukan untuk bayar hutang) —</option>';
    const otherLoans = state.loans.filter(l => l.id !== excludeLoanId && !l.settled);
    if (otherLoans.length > 0) {
      html += '<optgroup label="Bayar Pinjaman Lain">';
      otherLoans.forEach(l => {
        html += `<option value="loan:${l.id}">${escapeHtml(l.name)} (${fmt(l.principal)})</option>`;
      });
      html += '</optgroup>';
    }
    if (state.commitments.length > 0) {
      html += '<optgroup label="Bayar Komitmen">';
      state.commitments.forEach(c => {
        html += `<option value="commit:${c.id}">${escapeHtml(c.name)} (${fmt(c.amount)})</option>`;
      });
      html += '</optgroup>';
    }
    html += '</select></div>';
    return html;
  }

  function updateLossPreview() {
    const principal = parseFloat($('loanPrincipal').value) || 0;
    const received = parseFloat($('loanReceived').value) || 0;
    const loss = Math.max(0, principal - received);
    const el = $('lossPreview');
    if (principal > 0 && received > 0) {
      if (loss > 0) {
        const pct = ((loss / principal) * 100).toFixed(1);
        el.className = 'loss-preview has-loss';
        el.textContent = `Kerugian: ${fmt(loss)} (${pct}% daripada jumlah pinjaman) — ini kos sebenar meminjam kali ini.`;
      } else {
        el.className = 'loss-preview';
        el.textContent = 'Tiada kerugian dikesan — jumlah diterima sama atau lebih daripada jumlah pinjaman.';
      }
    } else {
      el.className = 'loss-preview';
      el.textContent = 'Isi jumlah pinjaman dan jumlah diterima untuk lihat kerugian.';
    }
  }

  function addLoan() {
    const name = $('loanName').value.trim();
    const dueDate = $('loanDueDate').value;
    const principal = parseFloat($('loanPrincipal').value) || 0;
    const received = parseFloat($('loanReceived').value) || 0;
    const monthlyPayment = parseFloat($('loanMonthlyPayment').value) || 0;
    const usedFor = $('loanUsedFor').value || null;
    if (!name || !dueDate || principal <= 0) {
      alert('Sila isi sekurang-kurangnya nama, tarikh due, dan jumlah pinjaman.');
      return;
    }
    const newLoan = { id: uid(), name, dueDate, principal, received, monthlyPayment, usedFor, settled: false, cashInjection: 0, createdAt: Date.now() };
    state.loans.push(newLoan);
    const delta = applyCashInjectionForLoan(newLoan);
    saveState();
    renderLoansTab();
    if (delta > 0) {
      alert(`Pinjaman disimpan. ${fmt(delta)} baki lebihan (selepas bayar komitmen) telah ditambah automatik ke Baki Wang Hari Ini.`);
    }
  }

  function markLoanSettled(id) {
    const loan = state.loans.find(l => l.id === id);
    if (loan) loan.settled = true;
    saveState();
    renderLoansTab();
  }

  let pendingDeleteLoanId = null;
  let editingUsedForLoanId = null;

  // Same options as buildUsedForSelector, but for editing an EXISTING loan: pre-selects
  // the loan's current usedFor value and uses a per-loan element id (multiple loan cards
  // can exist on screen at once).
  function buildUsedForSelectorInline(loanId, currentValue) {
    let html = `<select id="editUsedFor_${loanId}">`;
    html += `<option value=""${!currentValue ? ' selected' : ''}>— Perbelanjaan lain (bukan untuk bayar hutang) —</option>`;
    const otherLoans = state.loans.filter(l => l.id !== loanId && !l.settled);
    if (otherLoans.length > 0) {
      html += '<optgroup label="Bayar Pinjaman Lain">';
      otherLoans.forEach(l => {
        const val = 'loan:' + l.id;
        html += `<option value="${val}"${currentValue === val ? ' selected' : ''}>${escapeHtml(l.name)} (${fmt(l.principal)})</option>`;
      });
      html += '</optgroup>';
    }
    if (state.commitments.length > 0) {
      html += '<optgroup label="Bayar Komitmen">';
      state.commitments.forEach(c => {
        const val = 'commit:' + c.id;
        html += `<option value="${val}"${currentValue === val ? ' selected' : ''}>${escapeHtml(c.name)} (${fmt(c.amount)})</option>`;
      });
      html += '</optgroup>';
    }
    html += '</select>';
    return html;
  }

  function toggleEditUsedFor(id) {
    editingUsedForLoanId = editingUsedForLoanId === id ? null : id;
    pendingDeleteLoanId = null;
    renderLoansTab();
  }

  function cancelEditUsedFor() {
    editingUsedForLoanId = null;
    renderLoansTab();
  }

  function saveUsedFor(id) {
    const loan = state.loans.find(l => l.id === id);
    const select = $('editUsedFor_' + id);
    let delta = 0;
    if (loan && select) {
      loan.usedFor = select.value || null;
      delta = applyCashInjectionForLoan(loan);
    }
    editingUsedForLoanId = null;
    saveState();
    renderLoansTab();
    if (currentTab === 'summary') renderSummaryTab();
    if (delta > 0) {
      alert(`${fmt(delta)} baki lebihan pinjaman ini telah ditambah automatik ke Baki Wang Hari Ini.`);
    } else if (delta < 0) {
      alert(`Pautan ditukar/dibuang — ${fmt(Math.abs(delta))} telah ditolak balik daripada Baki Wang Hari Ini supaya kekal tepat.`);
    }
  }

  function removeLoan(id) {
    pendingDeleteLoanId = id;
    editingUsedForLoanId = null;
    renderLoansTab();
  }

  function confirmRemoveLoan(id) {
    state.loans = state.loans.filter(l => l.id !== id);
    pendingDeleteLoanId = null;
    saveState();
    renderLoansTab();
  }

  function cancelRemoveLoan() {
    pendingDeleteLoanId = null;
    renderLoansTab();
  }

  // ==================== RENDER: COMMITMENTS TAB ====================
  function renderCommitsTab() {
    let html = '<div class="card">';
    html += '<div class="card-title">💰 Anggaran Pendapatan Bulanan</div>';
    html += `<div class="form-field"><label>Pendapatan Bulanan</label><input type="number" id="incomeInput" value="${state.monthlyIncome || ''}" placeholder="3000" onchange="updateIncome(this.value)"></div>`;
    html += '</div>';

    html += '<div class="card">';
    html += '<div class="card-title">➕ Tambah Komitmen Bulanan</div>';
    html += '<div class="form-row-2">';
    html += '<div class="form-field"><label>Nama Komitmen</label><input type="text" id="commitName" placeholder="Contoh: Sewa Rumah, Astro"></div>';
    html += '<div class="form-field"><label>Jumlah</label><input type="number" id="commitAmount" placeholder="500"></div>';
    html += '</div>';
    html += '<div class="form-field"><label>Kategori</label><select id="commitCategory"><option value="akpk">🏛️ AKPK (Bayaran DMP Tetap)</option><option value="penting">🔴 Penting (Wajib Bayar)</option><option value="tidak-penting">🟢 Tidak Penting (Boleh Tangguh)</option></select></div>';
    html += '<button type="button" class="btn btn-primary" style="margin-top:8px;" onclick="addCommitment()">Simpan Komitmen</button>';
    html += '</div>';

    if (state.commitments.length === 0) {
      html += '<div class="card"><div class="empty-state">Belum ada komitmen direkodkan.</div></div>';
    } else {
      html += '<div class="card"><div class="card-title">Senarai Komitmen</div>';
      const categoryOrder = { akpk: 0, penting: 1, 'tidak-penting': 2 };
      const sorted = state.commitments.slice().sort((a, b) => (categoryOrder[a.category] ?? 1) - (categoryOrder[b.category] ?? 1));
      sorted.forEach(c => {
        const isDeferred = state.deferredIds.includes(c.id);
        const fundedLoan = commitmentFundedLoan(c.id);
        html += '<div>';
        html += '<div class="commit-row">';
        const tagLabel = c.category === 'akpk' ? 'AKPK' : (c.category === 'penting' ? 'PENTING' : 'BOLEH TANGGUH');
        html += `<span class="commit-tag ${c.category}">${tagLabel}</span>`;
        html += `<div class="commit-info ${isDeferred ? 'commit-deferred' : ''}">`;
        html += `<div class="commit-name">${escapeHtml(c.name)}</div>`;
        if (fundedLoan) html += `<div class="commit-status paid">✓ Dibayar guna pinjaman: ${escapeHtml(fundedLoan.name)}</div>`;
        else if (isDeferred) html += '<div class="commit-status unpaid">Ditangguh bulan ini</div>';
        html += '</div>';
        html += `<div class="commit-amount">${fmt(c.amount)}</div>`;
        html += `<button type="button" class="icon-btn-sm" onclick="removeCommitment('${c.id}')" title="Padam">✕</button>`;
        html += '</div>';
        if (pendingDeleteCommitId === c.id) {
          html += `<div class="delete-confirm-row">
            <span>Padam "${escapeHtml(c.name)}"? Tindakan ini tidak boleh dibatalkan.</span>
            <div class="delete-confirm-btns">
              <button type="button" class="btn-confirm-cancel" onclick="cancelRemoveCommitment()">Batal</button>
              <button type="button" class="btn-confirm-delete" onclick="confirmRemoveCommitment('${c.id}')">Ya, Padam</button>
            </div>
          </div>`;
        }
        html += '</div>';
      });
      html += '</div>';
    }

    $('contentRoot').innerHTML = html;
  }

  function updateIncome(value) {
    state.monthlyIncome = parseFloat(value) || 0;
    saveState();
  }

  function addCommitment() {
    const name = $('commitName').value.trim();
    const amount = parseFloat($('commitAmount').value) || 0;
    const category = $('commitCategory').value;
    if (!name || amount <= 0) {
      alert('Sila isi nama dan jumlah komitmen.');
      return;
    }
    state.commitments.push({ id: uid(), name, amount, category, createdAt: Date.now() });
    saveState();
    renderCommitsTab();
  }

  let pendingDeleteCommitId = null;

  function removeCommitment(id) {
    pendingDeleteCommitId = id;
    renderCommitsTab();
  }

  function confirmRemoveCommitment(id) {
    state.commitments = state.commitments.filter(c => c.id !== id);
    state.deferredIds = state.deferredIds.filter(did => did !== id);
    pendingDeleteCommitId = null;
    saveState();
    renderCommitsTab();
  }

  function cancelRemoveCommitment() {
    pendingDeleteCommitId = null;
    renderCommitsTab();
  }

  // ==================== RENDER: PLAN (RESCHEDULE) TAB ====================
  // Rule-based suggestion engine — NOT AI. Fixed logic: if monthly obligations exceed
  // income, suggest deferring "tidak-penting" commitments, largest amount first, until
  // the shortfall is covered (or no more can be deferred).
  function computeReschedulePlan() {
    const activeLoans = state.loans.filter(l => !l.settled);
    const loanMonthlyTotal = activeLoans.reduce((s, l) => s + (l.monthlyPayment || 0), 0);
    const pentingTotal = state.commitments.filter(c => isCommitmentMandatory(c) && !isCommitmentFundedByLoan(c)).reduce((s, c) => s + c.amount, 0);
    const tidakPentingCommits = state.commitments.filter(c => c.category === 'tidak-penting' && !isCommitmentFundedByLoan(c)).sort((a, b) => b.amount - a.amount);

    const mandatoryTotal = loanMonthlyTotal + pentingTotal;
    const shortfall = mandatoryTotal - (state.monthlyIncome || 0);

    const suggestions = [];
    let covered = 0;
    if (shortfall > 0) {
      for (const c of tidakPentingCommits) {
        if (covered >= shortfall) break;
        suggestions.push(c);
        covered += c.amount;
      }
    }
    return { shortfall, suggestions, covered, mandatoryTotal, loanMonthlyTotal, pentingTotal };
  }

  function renderPlanTab() {
    const plan = computeReschedulePlan();
    let html = '<div class="card">';
    html += '<div class="card-title">📋 Susunan Bayaran Dicadangkan</div>';

    if (state.monthlyIncome <= 0) {
      html += '<div class="empty-state">Sila isi anggaran pendapatan bulanan di tab Komitmen dahulu untuk dapatkan cadangan susunan bayaran.</div>';
    } else if (plan.shortfall <= 0) {
      html += `<div class="summary-note" style="background:var(--ok-soft);">Pendapatan bulanan awak (${fmt(state.monthlyIncome)}) mencukupi untuk semua komitmen wajib (${fmt(plan.mandatoryTotal)}). Tiada keperluan untuk tangguh komitmen buat masa ini. Baki: <strong>${fmt(state.monthlyIncome - plan.mandatoryTotal)}</strong></div>`;
    } else {
      html += `<div class="summary-note" style="background:var(--warn-soft);">Komitmen wajib bulan ini (${fmt(plan.mandatoryTotal)}) melebihi pendapatan awak (${fmt(state.monthlyIncome)}) sebanyak <strong>${fmt(plan.shortfall)}</strong>. Berikut cadangan komitmen yang boleh ditangguh dahulu, disusun daripada jumlah terbesar:</div>`;

      if (plan.suggestions.length === 0) {
        html += '<div class="empty-state">Tiada komitmen "boleh tangguh" untuk dicadangkan. Semua komitmen sedia ada adalah PENTING. Pertimbangkan untuk hubungi AKPK (03-2616 7766) untuk bantuan susun semula hutang secara rasmi.</div>';
      } else {
        plan.suggestions.forEach((c, i) => {
          html += `<div class="reschedule-item">`;
          html += `<div class="badge-num">${i + 1}</div>`;
          html += '<div class="info">';
          html += `<div class="name">${escapeHtml(c.name)}</div>`;
          html += `<div class="reason">Boleh tangguh — bukan komitmen wajib bulan ini</div>`;
          html += '</div>';
          html += `<div class="amt">${fmt(c.amount)}</div>`;
          html += '</div>';
        });
        const remaining = plan.shortfall - plan.covered;
        if (remaining > 0) {
          html += `<div class="alert-warn" style="margin-top:12px;"><div class="icon">ℹ️</div><div><div class="body">Walaupun semua komitmen di atas ditangguh, masih berbaki <strong>${fmt(remaining)}</strong> yang tidak dapat ditampung. Ini mungkin masa yang sesuai untuk berbincang dengan AKPK (03-2616 7766, percuma) tentang susunan semula hutang secara rasmi.</div></div></div>`;
        }
        html += `<button type="button" class="btn btn-primary" style="margin-top:14px;" onclick="applyDeferrals()">Tandakan Komitmen Ini Sebagai Ditangguh</button>`;
      }
    }
    html += '</div>';

    if (state.deferredIds.length > 0) {
      html += '<div class="card"><div class="card-title">✓ Sedang Ditangguh Bulan Ini</div>';
      state.commitments.filter(c => state.deferredIds.includes(c.id)).forEach(c => {
        html += `<div class="commit-row"><div class="commit-info"><div class="commit-name">${escapeHtml(c.name)}</div></div><div class="commit-amount">${fmt(c.amount)}</div><button type="button" class="icon-btn-sm" onclick="undeferCommitment('${c.id}')" title="Batal tangguh">↺</button></div>`;
      });
      html += '</div>';
    }

    $('contentRoot').innerHTML = html;
  }

  function applyDeferrals() {
    const plan = computeReschedulePlan();
    plan.suggestions.forEach(c => {
      if (!state.deferredIds.includes(c.id)) state.deferredIds.push(c.id);
    });
    saveState();
    renderPlanTab();
  }

  function undeferCommitment(id) {
    state.deferredIds = state.deferredIds.filter(did => did !== id);
    saveState();
    renderPlanTab();
  }

  // ==================== SHARED ====================
  // ==================== CASH BALANCE ====================
  function toggleCashBalanceEdit() {
    const row = $('cashBalanceEditRow');
    const isHidden = row.style.display === 'none';
    row.style.display = isHidden ? 'flex' : 'none';
    if (isHidden) {
      const input = $('cashBalanceInput');
      input.focus();
      input.select();
    }
  }

  function saveCashBalance() {
    const input = $('cashBalanceInput');
    const value = parseFloat(input.value);
    if (isNaN(value) || value < 0) {
      alert('Sila masukkan jumlah yang sah.');
      return;
    }
    state.cashBalance = value;
    state.cashBalanceUpdatedAt = Date.now();
    saveState();
    renderSummaryTab();
  }

  function formatRelativeTime(timestamp) {
    if (!timestamp) return '';
    const diffMs = Date.now() - timestamp;
    const diffMins = Math.floor(diffMs / (1000 * 60));
    if (diffMins < 1) return 'baru sahaja';
    if (diffMins < 60) return diffMins + ' minit lalu';
    const diffHours = Math.floor(diffMins / 60);
    if (diffHours < 24) return diffHours + ' jam lalu';
    const diffDays = Math.floor(diffHours / 24);
    if (diffDays === 1) return 'semalam';
    if (diffDays < 30) return diffDays + ' hari lalu';
    return new Date(timestamp).toLocaleDateString('ms-MY', { day: 'numeric', month: 'short', year: 'numeric' });
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function render() {
    if (currentTab === 'summary') renderSummaryTab();
    else if (currentTab === 'loans') renderLoansTab();
    else if (currentTab === 'commits') renderCommitsTab();
    else if (currentTab === 'plan') renderPlanTab();
  }

  // ==================== AUTH ====================
  let authMode = 'signin';

  function escapeHtmlLocal(str) {
    const div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function renderAuthScreen(errorMsg) {
    const configured = !!supabaseClient;
    let html = '<div class="auth-page"><div class="auth-card">';
    html += '<div class="auth-title">🧭 Hole</div>';
    html += '<div class="auth-sub">' + (authMode === 'signup' ? 'Daftar untuk simpan data merentas peranti' : 'Log masuk untuk akses data anda') + '</div>';
    if (!configured && supabaseLoadError) {
      html += '<div class="auth-note">Tak dapat sambung ke perkhidmatan cloud. Boleh guna app di peranti ini sahaja buat sementara.</div>';
    }
    if (errorMsg) html += `<div class="auth-error">${escapeHtmlLocal(errorMsg)}</div>`;
    html += '<div class="auth-field"><label>Emel</label><input type="email" id="authEmail" placeholder="anda@emel.com" autocomplete="email"></div>';
    html += '<div class="auth-field"><label>Kata laluan</label><input type="password" id="authPassword" placeholder="••••••••" autocomplete="' + (authMode === 'signup' ? 'new-password' : 'current-password') + '"></div>';
    html += `<button class="auth-btn" id="authSubmitBtn" onclick="handleAuthSubmit()" ${configured ? '' : 'disabled'}>` + (authMode === 'signup' ? 'Daftar' : 'Log Masuk') + '</button>';
    html += '<div class="auth-switch">';
    if (authMode === 'signup') html += 'Dah ada akaun? <button type="button" onclick="switchAuthMode(\'signin\')">Log masuk</button>';
    else html += 'Belum ada akaun? <button type="button" onclick="switchAuthMode(\'signup\')">Daftar</button>';
    html += '</div>';
    html += '<div class="auth-skip"><button type="button" onclick="skipAuth()">Guna tanpa log masuk (peranti ini sahaja)</button></div>';
    html += '</div></div>';
    $('authRoot').innerHTML = html;
  }

  function switchAuthMode(mode) { authMode = mode; renderAuthScreen(); }

  function skipAuth() {
    loadStateLocal();
    syncStatus = 'local';
    $('authRoot').innerHTML = '';
    $('authRoot').style.display = 'none';
    $('mainPage').style.display = '';
    render();
    renderSyncBadge();
  }

  async function handleAuthSubmit() {
    const email = ($('authEmail').value || '').trim();
    const password = $('authPassword').value || '';
    if (!email || !password) { renderAuthScreen('Sila isi emel dan kata laluan.'); return; }
    const btn = $('authSubmitBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Sila tunggu…'; }
    try {
      if (authMode === 'signup') {
        const { data, error } = await supabaseClient.auth.signUp({ email, password });
        if (error) throw error;
        if (data.user && !data.session) {
          renderAuthScreen('Emel pengesahan telah dihantar. Sila semak emel anda, kemudian log masuk.');
          authMode = 'signin';
          return;
        }
        currentUser = data.user;
      } else {
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        currentUser = data.user;
      }
      await enterApp();
    } catch (err) {
      renderAuthScreen(err.message || (authMode === 'signup' ? 'Pendaftaran gagal.' : 'Log masuk gagal.'));
    }
  }

  async function enterApp() {
    $('authRoot').innerHTML = '';
    $('authRoot').style.display = 'none';
    $('mainPage').style.display = '';
    // Load local data first so the app is usable immediately, then try to sync from
    // the cloud — if the user has cloud data already, it overrides the local copy.
    loadStateLocal();
    syncStatus = 'syncing';
    render();
    renderSyncBadge();
    const ok = await loadStateCloud();
    syncStatus = ok ? 'synced' : 'error';
    render();
    renderSyncBadge();
  }

  function handleLogout() {
    if (supabaseClient && currentUser) supabaseClient.auth.signOut();
    currentUser = null;
    syncStatus = 'local';
    $('mainPage').style.display = 'none';
    $('authRoot').style.display = '';
    authMode = 'signin';
    renderAuthScreen();
  }

  async function initAuth() {
    if (!supabaseClient) { skipAuth(); return; }
    const { data } = await supabaseClient.auth.getSession();
    if (data && data.session && data.session.user) {
      currentUser = data.session.user;
      await enterApp();
    } else {
      renderAuthScreen();
    }
  }

  initTheme();
  initAuth();
</script>

</body>
